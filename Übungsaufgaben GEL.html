        let currentQuizKey = 'block1';
        let currentQuestionIndex = 0;
        let userAnswers = [];

        function showMenu() {
            document.getElementById('menu-view').classList.remove('hidden');
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('quiz-title').innerText = "Menü";
        }

        function startQuiz(key) {
            currentQuizKey = key;
            currentQuestionIndex = 0;
            const total = questionsData[key].length;

            // Versuche gespeicherte Antworten aus dem Browser-Speicher zu laden
            const savedAnswers = localStorage.getItem('quiz_answers_' + key);
            if (savedAnswers) {
                try {
                    userAnswers = JSON.parse(savedAnswers);
                } catch (e) {
                    userAnswers = new Array(total).fill(null);
                }
            } else {
                userAnswers = new Array(total).fill(null);
            }

            document.getElementById('menu-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('quiz-title').innerText = key === 'block1' ? "Block 1" : "Block 2";

            renderQuestion();
        }

        function renderQuestion() {
            const list = questionsData[currentQuizKey];
            const q = list[currentQuestionIndex];

            document.getElementById('progress-text').innerText = `Frage ${currentQuestionIndex + 1} von ${list.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / list.length) * 100}%`;
            
            const badge = document.getElementById('difficulty-badge');
            badge.innerText = q.d || "Mittel";
            if (q.d === "Einfach") badge.className = "font-semibold text-emerald-400";
            else if (q.d === "Schwer") badge.className = "font-semibold text-rose-400";
            else badge.className = "font-semibold text-amber-400";

            document.getElementById('question-category').innerText = q.cat || "";
            document.getElementById('question-text').innerText = q.q;

            // Fragenbild handhaben
            const imgContainer = document.getElementById('image-container');
            const imgElement = document.getElementById('question-image');
            const questionImgSrc = q.qImage || q.image;

            if (questionImgSrc) {
                imgElement.src = questionImgSrc;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
                imgElement.src = "";
            }

            // Optionen rendern
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = "";

            q.a.forEach((option, idx) => {
                const optText = typeof option === 'object' ? option.text : option;
                const optImg = typeof option === 'object' ? option.image : null;

                const btn = document.createElement('button');
                btn.onclick = () => selectOption(idx);

                const isSelected = userAnswers[currentQuestionIndex] === idx;
                
                btn.className = `w-full text-left p-4 rounded-lg border transition-all flex flex-col gap-3 ${
                    isSelected 
                        ? 'bg-amber-500/10 border-amber-400 text-amber-300 font-medium shadow-sm' 
                        : 'bg-slate-900/50 hover:bg-slate-700/50 border-slate-700 text-slate-200'
                }`;

                let htmlContent = `<div class="flex items-start gap-3">
                    <span class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold border shrink-0 ${
                        isSelected ? 'border-amber-400 bg-amber-400 text-slate-950' : 'border-slate-600 text-slate-400'
                    }">${String.fromCharCode(65 + idx)}</span>
                    <span class="text-sm pt-0.5 leading-normal flex-1">${optText}</span>
                </div>`;

                if (optImg) {
                    htmlContent += `
                        <div class="mt-1 w-full bg-slate-950/40 p-2 rounded border border-slate-700/50 flex justify-center">
                            <img src="${optImg}" alt="Antwortbild ${idx + 1}" class="max-h-40 object-contain rounded">
                        </div>
                    `;
                }

                btn.innerHTML = htmlContent;
                optionsContainer.appendChild(btn);
            });

            // Navigation State
            document.getElementById('prev-btn').disabled = (currentQuestionIndex === 0);
            
            const nextBtn = document.getElementById('next-btn');
            if (currentQuestionIndex === list.length - 1) {
                nextBtn.innerText = "Auswerten";
                nextBtn.className = "flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 py-3 rounded-lg text-sm font-bold shadow transition-all";
            } else {
                nextBtn.innerText = "Weiter";
                nextBtn.className = "flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-3 rounded-lg text-sm font-bold shadow transition-all";
            }

            // Math Rendering (KaTeX)
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('quiz-view'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIndex] = idx;
            // Fortschritt im localStorage abspeichern
            localStorage.setItem('quiz_answers_' + currentQuizKey, JSON.stringify(userAnswers));
            renderQuestion();
        }

        function resetAllProgress() {
            if (confirm("Möchtest du deinen gesamten gespeicherten Lernfortschritt für alle Blöcke wirklich zurücksetzen?")) {
                // Löscht alle Quiz-Antworten aus dem Speicher
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('quiz_answers_')) {
                        localStorage.removeItem(key);
                    }
                });
                alert("Der Fortschritt wurde erfolgreich zurückgesetzt.");
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            const list = questionsData[currentQuizKey];
            if (currentQuestionIndex < list.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const list = questionsData[currentQuizKey];
            let correctCount = 0;

            list.forEach((q, i) => {
                if (userAnswers[i] === q.c) {
                    correctCount++;
                }
            });

            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.getElementById('quiz-title').innerText = "Auswertung";

            document.getElementById('result-score').innerText = `${correctCount} / ${list.length}`;
            
            const percentage = Math.round((correctCount / list.length) * 100);
            const feedback = document.getElementById('result-feedback');
            if (percentage >= 80) {
                feedback.innerText = `Hervorragend! Du hast ${percentage}% der Fragen richtig beantwortet.`;
                feedback.className = "text-sm text-emerald-400 font-semibold";
            } else if (percentage >= 50) {
                feedback.innerText = `Gute Leistung! Du hast ${percentage}% erreicht. Schau dir die falschen Fragen nochmal an.`;
                feedback.className = "text-sm text-amber-400 font-semibold";
            } else {
                feedback.innerText = `Du hast ${percentage}% erreicht. Wiederhole den Übungsblock, benutze den Hefter und Fachbücher, um die Lücken zu schließen.`;
                feedback.className = "text-sm text-rose-400 font-semibold";
            }

            // Review List
            const reviewContainer = document.getElementById('review-container');
            reviewContainer.innerHTML = "";

            list.forEach((q, i) => {
                const isAnswered = userAnswers[i] !== null;
                const isCorrect = userAnswers[i] === q.c;

                const item = document.createElement('div');
                item.onclick = () => jumpToQuestion(i);
                item.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 cursor-pointer hover:border-slate-500 transition-all flex items-center justify-between gap-3";

                let statusBadge = '';
                if (!isAnswered) {
                    statusBadge = '<span class="bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded font-semibold shrink-0">Offen</span>';
                } else if (isCorrect) {
                    statusBadge = '<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2.5 py-1 rounded font-semibold shrink-0">Richtig</span>';
                } else {
                    statusBadge = '<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-2.5 py-1 rounded font-semibold shrink-0">Falsch</span>';
                }

                item.innerHTML = `
                    <div class="space-y-1 overflow-hidden">
                        <div class="text-xs text-amber-400 font-semibold uppercase">Frage ${i + 1} • ${q.cat || 'Allgemein'}</div>
                        <div class="text-sm font-medium text-slate-200 truncate">${q.q}</div>
                    </div>
                    ${statusBadge}
                `;
                reviewContainer.appendChild(item);
            });

            if (window.renderMathInElement) {
                renderMathInElement(reviewContainer, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function jumpToQuestion(index) {
            currentQuestionIndex = index;
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('quiz-title').innerText = currentQuizKey === 'block1' ? "Block 1" : "Block 2";
            renderQuestion();
        }

        function reviewAndCorrect() {
            const list = questionsData[currentQuizKey];
            const firstWrongOrOpen = userAnswers.findIndex((ans, idx) => ans === null || ans !== list[idx].c);
            
            if (firstWrongOrOpen !== -1) {
                jumpToQuestion(firstWrongOrOpen);
            } else {
                jumpToQuestion(0);
            }
        }
    </script>
</body>
</html>
